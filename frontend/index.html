<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent 群聊</title>
<style>
:root {
  --bg: #f0f2f5; --sidebar-bg: #fff; --chat-bg: #f7f8fa;
  --text: #1a1a2e; --text-muted: #8e8e9a; --text-header: #111;
  --accent: #4f6ef7; --accent-hover: #3b54d4;
  --danger: #e03a3a; --danger-hover: #c62828;
  --gold: #b8860b; --green: #2da44e;
  --border: #e2e5e9; --border-light: #eef0f2;
  --bubble-self: #e8f0fe; --bubble-other: #fff;
  --input-bg: #fff;
  --sidebar-w: 210px;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }
body { background:var(--bg); color:var(--text); font-family:"Segoe UI","Microsoft YaHei",-apple-system,sans-serif; display:flex; }
::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#c4c9d0; border-radius:3px; }

/* Sidebar */
.sidebar { width:var(--sidebar-w); min-width:var(--sidebar-w); max-width:var(--sidebar-w); background:var(--sidebar-bg); display:flex; flex-direction:column; flex-shrink:0; border-right:1px solid var(--border); }
.sidebar-header { padding:14px 16px; border-bottom:1px solid var(--border); }
.sidebar-header h2 { font-size:13px; font-weight:700; color:var(--text); letter-spacing:.3px; }
.group-list { flex:1; overflow-y:auto; overflow-x:hidden; padding:8px; }
.group-item { display:flex; align-items:center; gap:6px; padding:7px 10px; border-radius:6px; cursor:pointer; margin-bottom:1px; transition:background .12s; }
.group-item:hover { background:#f0f2f5; }
.group-item.active { background:#e8ecf8; }
.group-item .hash { font-size:15px; color:var(--text-muted); flex-shrink:0; font-weight:400; }
.group-item.active .hash { color:var(--accent); }
.group-item .info { flex:1; min-width:0; }
.group-item .name { font-size:13px; font-weight:500; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.group-item.active .name { color:var(--text); font-weight:600; }
.group-item .preview { font-size:11px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
.group-item .del { color:var(--text-muted); font-size:11px; padding:2px 4px; border-radius:3px; flex-shrink:0; opacity:0; transition:opacity .12s; }
.group-item:hover .del { opacity:1; }
.group-item .del:hover { color:#fff; background:var(--danger); }
.group-item .unread { background:var(--danger); color:#fff; font-size:10px; font-weight:700; min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 4px; flex-shrink:0; }
.new-group { padding:10px 12px; border-top:1px solid var(--border); display:flex; gap:4px; }
.new-group input { flex:1; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:6px 10px; border-radius:6px; font-size:12px; outline:none; min-width:0; }
.new-group input:focus { border-color:var(--accent); }
.new-group input::placeholder { color:var(--text-muted); }
.new-group button { background:var(--accent); color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:12px; font-weight:500; white-space:nowrap; transition:background .12s; }
.new-group button:hover { background:var(--accent-hover); }

/* Main */
.main { flex:1; display:flex; flex-direction:column; background:var(--chat-bg); min-width:0; position:relative; }
.chat-header { padding:0 16px; border-bottom:1px solid var(--border); background:var(--sidebar-bg); display:flex; align-items:center; gap:8px; min-height:44px; flex-shrink:0; }
.chat-header .hash { font-size:18px; color:var(--text-muted); flex-shrink:0; }
.chat-header .title { font-size:14px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chat-header .actions { margin-left:auto; display:flex; gap:2px; flex-shrink:0; }
.icon-btn { width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:5px; cursor:pointer; border:none; background:transparent; color:var(--text-muted); transition:all .12s; }
.icon-btn:hover { color:var(--text); background:#f0f2f5; }
.icon-btn.active { color:var(--accent); background:#e8ecf8; }
.icon-btn.danger:hover { color:#fff; background:var(--danger); }

/* Messages */
.messages { flex:1; overflow-y:auto; overflow-x:hidden; min-height:0; }
.messages-inner { padding:8px 0 12px; min-height:100%; display:flex; flex-direction:column; justify-content:flex-end; }
.empty-state { color:var(--text-muted); text-align:center; padding:40px 20px; font-size:13px; }
.empty-state .icon { font-size:36px; margin-bottom:8px; opacity:.2; }

.msg-group { padding:0 16px; display:flex; gap:10px; margin-top:12px; }
.msg-group.compact { margin-top:2px; } .msg-group.compact .msg-bubble { margin-top:3px; border-radius:8px; }
.msg-group.compact .msg-avatar-wrap { visibility:hidden; }
.msg-group.compact .msg-author { display:none; }
.msg-avatar-wrap { flex-shrink:0; width:34px; padding-top:1px; }
.msg-avatar { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; cursor:pointer; flex-shrink:0; transition:border-radius .15s; }
.msg-avatar:hover { border-radius:10px; }
.msg-content { flex:1; min-width:0; }

.msg-bubble { display:block; max-width:80%; padding:8px 14px; border-radius:14px; font-size:13px; line-height:1.5; word-break:break-word; white-space:pre-wrap; }
.msg-bubble + .msg-bubble { margin-top:3px; }
.msg-other .msg-bubble { background:var(--bubble-other); border:1px solid var(--border-light); border-top-left-radius:4px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
.msg-self .msg-bubble { background:var(--bubble-self); border:1px solid #d2e3fc; border-top-right-radius:4px; margin-left:auto; }

.msg-author { display:flex; align-items:baseline; gap:5px; margin-bottom:3px; flex-wrap:wrap; }
.msg-author .name { font-size:12px; font-weight:600; cursor:pointer; }
.msg-author .name:hover { text-decoration:underline; }
.msg-author .time { font-size:10px; color:var(--text-muted); }
.msg-author .badge { font-size:9px; padding:1px 5px; border-radius:3px; font-weight:600; }
.badge-bot { background:var(--accent); color:#fff; }

.msg-mentions { display:flex; gap:4px; flex-wrap:wrap; margin-top:4px; }
.msg-mentions .tag { font-size:10px; background:rgba(79,110,247,.1); color:var(--accent); padding:1px 7px; border-radius:10px; font-weight:500; }

.msg-error { padding:6px 16px; margin:0 16px; background:#fef0f0; border:1px solid #fcc; border-radius:6px; color:var(--danger); font-size:11px; display:none; }

/* Avatar colors */
.avatar-designer1 { background:#fff3cd; color:#b8860b; }
.avatar-designer2 { background:#d6ecfb; color:#1a73b5; }
.avatar-human { background:#d4edda; color:#1e7e34; }
.avatar-system { background:#e9ecef; color:#6c757d; }
.avatar-reviewer { background:#e8daef; color:#7d3c98; }
.name-designer1 { color:#b8860b; }
.name-designer2 { color:#1a73b5; }
.name-human { color:#1e7e34; }
.name-reviewer { color:#7d3c98; }
.name-system { color:#6c757d; }

/* Floating members overlay */
.members-overlay { position:fixed; top:0; right:0; bottom:0; width:220px; background:var(--sidebar-bg); border-left:1px solid var(--border); z-index:100; transform:translateX(100%); transition:transform .2s ease; display:flex; flex-direction:column; box-shadow:-4px 0 20px rgba(0,0,0,.08); }
.members-overlay.open { transform:translateX(0); }
.members-overlay h3 { padding:14px 12px 6px; font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); font-weight:600; display:flex; align-items:center; justify-content:space-between; }
.members-overlay .close-btn { background:none; border:none; color:var(--text-muted); cursor:pointer; padding:2px 6px; border-radius:3px; font-size:14px; line-height:1; }
.members-overlay .close-btn:hover { background:#f0f2f5; color:var(--text); }
.member-list { flex:1; overflow-y:auto; overflow-x:hidden; padding:0 8px; }
.member-item { display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:5px; cursor:pointer; transition:background .1s; }
.member-item:hover { background:#f0f2f5; }
.member-item .m-avatar { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; flex-shrink:0; }
.member-item .m-info { min-width:0; }
.member-item .m-name { font-size:12px; font-weight:500; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.member-item .m-role { font-size:10px; color:var(--text-muted); }
.member-item .m-status { width:6px; height:6px; border-radius:50%; margin-left:auto; flex-shrink:0; background:var(--green); }
.members-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.15); z-index:99; display:none; }
.members-backdrop.show { display:block; }

/* Input */
.input-area { padding:0 12px 14px; flex-shrink:0; }
.input-wrap { background:var(--input-bg); border:1px solid var(--border); border-radius:10px; padding:0 10px; display:flex; align-items:flex-end; gap:6px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
.input-wrap:focus-within { border-color:var(--accent); box-shadow:0 1px 4px rgba(79,110,247,.12); }
.input-wrap textarea { flex:1; background:transparent; border:none; color:var(--text); font-size:13px; line-height:1.4; padding:10px 0; resize:none; outline:none; font-family:inherit; min-height:40px; max-height:140px; }
.input-wrap textarea::placeholder { color:var(--text-muted); }
.input-wrap textarea:disabled { opacity:.4; }
.input-wrap .input-actions { display:flex; gap:4px; padding:6px 0; align-items:center; flex-shrink:0; }
.input-wrap .input-actions select { background:var(--chat-bg); border:1px solid var(--border); color:var(--text); padding:4px 8px; border-radius:5px; font-size:11px; outline:none; cursor:pointer; max-width:110px; }
.input-wrap .input-actions select:focus { border-color:var(--accent); }
.send-btn { background:transparent; border:none; color:var(--accent); padding:4px; cursor:pointer; border-radius:5px; transition:all .12s; display:flex; align-items:center; flex-shrink:0; }
.send-btn:hover:not(:disabled) { background:#e8f0fe; }
.send-btn:disabled { opacity:.3; cursor:not-allowed; }

.conn-bar { padding:3px 16px; font-size:10px; text-align:center; display:none; flex-shrink:0; }
.conn-bar.reconnecting { display:block; background:#fff3cd; color:#856404; }

@media (max-width:600px) {
  :root { --sidebar-w: 48px; }
  .sidebar-header h2 { display:none; }
  .group-item .info, .group-item .del { display:none; }
  .new-group input { display:none; }
  .new-group button { width:100%; }
  .msg-group { padding:0 8px; gap:6px; }
}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header"><h2>Agent 群聊</h2></div>
  <div class="group-list" id="groupList"></div>
  <div class="new-group">
    <input id="newGroupId" placeholder="新建群聊…" onkeydown="if(event.key==='Enter')createGroup()">
    <button onclick="createGroup()">+</button>
  </div>
</div>

<div class="main">
  <div class="chat-header" id="chatHeader">
    <span class="hash">#</span>
    <span class="title">选择群聊</span>
    <div class="actions" id="headerActions"></div>
  </div>

  <div class="conn-bar" id="connBar"></div>

  <div class="messages" id="messages">
    <div class="msg-error" id="msgError"></div>
    <div class="messages-inner" id="messagesInner">
      <div class="empty-state"><div class="icon">#</div>选择一个群聊开始对话</div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <textarea id="msgInput" rows="1" placeholder="输入消息… Enter 发送" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
      <div class="input-actions">
        <select id="roleSelect" onchange="onRoleChange()"></select>
        <button class="send-btn" id="sendBtn" onclick="send()" title="发送">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Floating members -->
<div class="members-backdrop" id="membersBackdrop" onclick="toggleMembers()"></div>
<div class="members-overlay" id="membersOverlay">
  <h3>成员 <button class="close-btn" onclick="toggleMembers()">x</button></h3>
  <div class="member-list" id="memberList">
    <div style="padding:12px;color:var(--text-muted);font-size:11px;">暂无成员</div>
  </div>
</div>

<script>
const API = '';
let currentGroup = '', lastId = 0, es = null, agents = {}, myRole = 'human', lastAuthor = '';
let unread = {}, reconnectTimer = null, sending = false, membersOpen = false;

// ── HTML escaping ──
function esc(s) {
  if (!s && s !== 0) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── DOM helpers ──
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// ── Persist unread to localStorage ──
function loadUnread() {
  try { return JSON.parse(localStorage.getItem('agc_unread')||'{}'); } catch(e) { return {}; }
}
function saveUnread() {
  try { localStorage.setItem('agc_unread', JSON.stringify(unread)); } catch(e) {}
}

// ── Members toggle ──
function toggleMembers() {
  membersOpen = !membersOpen;
  document.getElementById('membersOverlay').classList.toggle('open', membersOpen);
  document.getElementById('membersBackdrop').classList.toggle('show', membersOpen);
}

// ── Header buttons (SVG only, no user data in innerHTML) ──
function buildHeader(gid) {
  const hash = document.getElementById('chatHeader').querySelector('.hash');
  const title = document.getElementById('chatHeader').querySelector('.title');
  const actions = document.getElementById('headerActions');
  if (!gid) {
    if (hash) hash.style.display = '';
    title.textContent = '选择群聊';
    actions.innerHTML = '';
    return;
  }
  if (hash) hash.style.display = '';
  title.textContent = gid;

  // Members button
  const memBtn = document.createElement('button');
  memBtn.className = 'icon-btn';
  memBtn.title = '成员列表';
  memBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4-4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>';
  memBtn.onclick = toggleMembers;

  // Delete button
  const delBtn = document.createElement('button');
  delBtn.className = 'icon-btn danger';
  delBtn.title = '删除群聊';
  delBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>';
  delBtn.onclick = function() { confirmDelete(gid); };

  actions.innerHTML = '';
  actions.appendChild(memBtn);
  actions.appendChild(delBtn);
}

// ── Init ──
async function init() {
  unread = loadUnread();
  try {
    const r = await fetch(API+'/api/agents');
    if (!r.ok) throw new Error(r.status);
    agents = (await r.json()).agents;
    buildRoleSelect();
  } catch(e) { showError('无法加载 Agent 列表'); }
  await loadGroups();
}

function buildRoleSelect() {
  const sel = document.getElementById('roleSelect');
  sel.innerHTML = '';
  for (const [id, a] of Object.entries(agents)) {
    const o = el('option', '', a.name);
    o.value = id;
    sel.appendChild(o);
  }
  if (agents['human']) { sel.value = 'human'; myRole = 'human'; }
}

function onRoleChange() {
  myRole = document.getElementById('roleSelect').value;
  if (currentGroup) reloadChat();
}

async function reloadChat() {
  lastId = 0; lastAuthor = '';
  document.getElementById('messagesInner').innerHTML = '';
  // Close old SSE before reconnecting
  if (es) { es.close(); es = null; }
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  await loadMessages(currentGroup);
  connectSSE();
}

function showError(m) {
  const err = document.getElementById('msgError');
  err.textContent = m; err.style.display = 'block';
  setTimeout(function() { err.style.display = 'none'; }, 3500);
}

// ── Groups ──
async function loadGroups() {
  try {
    const r = await fetch(API+'/api/groups');
    if (!r.ok) return;
    const d = await r.json();
    const list = document.getElementById('groupList');
    list.innerHTML = '';
    for (const g of d.groups) {
      const item = el('div', 'group-item' + (g.group_id===currentGroup?' active':''));

      const hash = el('span', 'hash', '#');
      item.appendChild(hash);

      const info = el('div', 'info');
      info.onclick = function() { selectGroup(g.group_id); };
      info.appendChild(el('div', 'name', g.group_id));
      info.appendChild(el('div', 'preview', g.last_message || '暂无消息'));
      item.appendChild(info);

      const ur = unread[g.group_id] || 0;
      if (ur > 0 && g.group_id !== currentGroup) {
        const badge = el('span', 'unread', ur > 99 ? '99+' : String(ur));
        item.appendChild(badge);
      }

      const del = el('span', 'del', 'x');
      del.title = '删除';
      del.onclick = function(e) { e.stopPropagation(); confirmDelete(g.group_id); };
      item.appendChild(del);

      list.appendChild(item);
    }
  } catch(e) {}
}

async function createGroup() {
  const gid = document.getElementById('newGroupId').value.trim();
  if (!gid) return;
  try {
    const r = await fetch(API+'/api/groups', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({group_id:gid}) });
    if (!r.ok) { const d = await r.json(); throw new Error(d.detail||'失败'); }
    document.getElementById('newGroupId').value = '';
    await loadGroups(); selectGroup(gid);
  } catch(e) { alert('创建失败：'+e.message); }
}

function confirmDelete(gid) {
  if (!gid) return;
  if (confirm('删除 #'+gid+'？消息将被永久删除。')) deleteGroupById(gid);
}

async function deleteGroupById(gid) {
  try { await fetch(API+'/api/groups/'+gid, { method:'DELETE' }); } catch(e) {}
  delete unread[gid]; saveUnread();
  if (currentGroup === gid) leaveGroup();
  await loadGroups();
}

function leaveGroup() {
  currentGroup = '';
  if (membersOpen) toggleMembers();
  buildHeader(null);
  document.getElementById('messagesInner').innerHTML = '<div class="empty-state"><div class="icon">#</div>选择一个群聊开始对话</div>';
  document.getElementById('memberList').innerHTML = '<div style="padding:12px;color:var(--text-muted);font-size:11px;">暂无成员</div>';
  if (es) { es.close(); es = null; }
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  document.getElementById('connBar').className = 'conn-bar';
}

// ── Messages ──
async function selectGroup(gid) {
  currentGroup = gid; lastId = 0; lastAuthor = '';
  unread[gid] = 0; saveUnread();
  buildHeader(gid);
  document.getElementById('messagesInner').innerHTML = '';
  await loadGroups(); await loadMessages(gid); await loadMembers(gid);
  connectSSE(); document.getElementById('msgInput').focus();
}

async function loadMessages(gid) {
  try {
    const r = await fetch(API+'/api/messages/'+gid);
    if (!r.ok) return;
    var data = await r.json();
    if (!data || !Array.isArray(data.messages)) return;
    var all = data.messages;
    if (myRole !== 'human') {
      all = all.filter(function(m) {
        var mentions = m.mentions;
        if (!mentions || !mentions.length) return true;
        return mentions.indexOf(myRole) >= 0;
      });
    }
    for (var i = 0; i < all.length; i++) { addMsg(all[i]); lastId = all[i].id; }
    scrollBottom();
  } catch(e) { showError('加载失败: '+e.message); }
}

function addMsg(m) {
  var container = document.getElementById('messagesInner');
  var isSelf = m.role === myRole;
  var sameAuthor = m.role === lastAuthor;
  lastAuthor = m.role || 'system';

  if (!sameAuthor) {
    var grp = el('div', 'msg-group ' + (isSelf ? 'msg-self' : 'msg-other'));

    var aw = el('div', 'msg-avatar-wrap');
    var avText = (agents[m.role] && agents[m.role].avatar) || m.avatar || (m.from||'?')[0]; var av = el('div', 'msg-avatar avatar-' + (m.role||'system'), avText);
    aw.appendChild(av); grp.appendChild(aw);

    var content = el('div', 'msg-content');

    var author = el('div', 'msg-author');
    var ns = el('span', 'name name-' + (m.role||'system'), m.from);
    author.appendChild(ns);

    if (m.role && m.role !== 'human' && agents[m.role]) {
      var b = el('span', 'badge badge-bot', 'BOT');
      author.appendChild(b);
    }

    var ts = el('span', 'time', formatTime(m.time));
    author.appendChild(ts);
    content.appendChild(author);

    var bubble = el('div', 'msg-bubble', m.text);
    content.appendChild(bubble);

    if (m.mentions && m.mentions.length) {
      var tags = el('div', 'msg-mentions');
      m.mentions.forEach(function(id) {
        var t = el('span', 'tag', '@' + (agents[id] ? agents[id].name : id));
        tags.appendChild(t);
      });
      content.appendChild(tags);
    }

    grp.appendChild(content);
    container.appendChild(grp);
  } else {
    var groups = container.querySelectorAll(':scope > .msg-group');
    if (!groups.length) { lastAuthor = null; return addMsg(m); }
    var last = groups[groups.length-1];
    last.classList.add('compact');
    var bubble = el('div', 'msg-bubble', m.text);
    last.querySelector('.msg-content').appendChild(bubble);
    if (m.mentions && m.mentions.length) {
      var tags = el('div', 'msg-mentions');
      m.mentions.forEach(function(id) {
        var t = el('span', 'tag', '@' + (agents[id] ? agents[id].name : id));
        tags.appendChild(t);
      });
      last.querySelector('.msg-content').appendChild(tags);
    }
  }
}

function formatTime(t) {
  if (!t) return '';
  if (/^\d{4}-\d{2}-\d{2}/.test(t)) {
    var today = new Date().toISOString().slice(0,10);
    return t.startsWith(today) ? t.slice(11) : t.slice(5);
  }
  return t;
}

function scrollBottom() {
  requestAnimationFrame(function() {
    var m = document.getElementById('messages'); m.scrollTop = m.scrollHeight;
  });
}

// ── Members ──
async function loadMembers(gid) {
  try {
    var r = await fetch(API+'/api/groups/'+gid+'/members');
    if (!r.ok) return;
    var d = await r.json();
    var ml = document.getElementById('memberList');
    if (!d.members.length) { ml.innerHTML = '<div style="padding:12px;color:var(--text-muted);font-size:11px;">暂无成员</div>'; return; }
    ml.innerHTML = '';
    d.members.forEach(function(m) {
      var item = el('div', 'member-item');
      item.appendChild(el('div', 'm-avatar avatar-'+m.role, m.avatar));
      var info = el('div', 'm-info');
      info.appendChild(el('div', 'm-name', m.name));
      var sub = m.last_seen ? '最后活跃 ' + m.last_seen : '已加入';
      if (!m.active) sub = '仅监听';
      info.appendChild(el('div', 'm-role', sub));
      item.appendChild(info);
      item.appendChild(el('div', 'm-status'));
      ml.appendChild(item);
    });
  } catch(e) {}
}

// ── SSE ──
function connectSSE() {
  if (es) es.close();
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  document.getElementById('connBar').className = 'conn-bar';
  es = new EventSource(API+'/api/stream/'+currentGroup);
  es.onopen = function() { document.getElementById('connBar').className = 'conn-bar'; };
  es.onmessage = function(e) {
    if (!e.data) return;
    try {
      var m = JSON.parse(e.data);
      if (myRole !== 'human' && m.mentions && m.mentions.length && !m.mentions.includes(myRole)) return;
      if (m.id > lastId) {
        if (m.id > lastId+1 && lastId>0) fillGap(lastId+1, m.id-1);
        addMsg(m); lastId = m.id; scrollBottom(); loadMembers(currentGroup);
      }
    } catch(ex) {}
  };
  es.onerror = function() {
    es.close();
    document.getElementById('connBar').className = 'conn-bar reconnecting';
    document.getElementById('connBar').textContent = '连接断开，重连中…';
    reconnectTimer = setTimeout(function() { fillGap(lastId+1, Infinity).then(function() { connectSSE(); }); }, 3000);
  };
}

async function fillGap(fromId, toId) {
  try {
    var url = API+'/api/messages/'+currentGroup+'?since='+(fromId-1);
    var r = await fetch(url); if (!r.ok) return;
    var msgs = (await r.json()).messages;
    if (myRole !== 'human') {
      msgs = msgs.filter(function(m) {
        return !m.mentions || !m.mentions.length || m.mentions.indexOf(myRole) >= 0;
      });
    }
    for (var i = 0; i < msgs.length; i++) { if (msgs[i].id > lastId) { addMsg(msgs[i]); lastId = msgs[i].id; } }
  } catch(e) {}
}

// ── Send ──
async function send() {
  if (sending) return;
  var input = document.getElementById('msgInput');
  var text = input.value.trim();
  if (!text || !currentGroup) return;
  sending = true;
  var btn = document.getElementById('sendBtn');
  btn.disabled = true; input.disabled = true;
  try {
    var agent = agents[myRole];
    var url, body;
    if (myRole === 'human' || !agent) {
      url = API+'/api/send/'+currentGroup;
      body = JSON.stringify({from_name:agent?agent.name:'用户', role:myRole, text:text});
    } else {
      url = API+'/api/send/'+currentGroup+'/'+myRole;
      body = JSON.stringify({text:text});
    }
    var r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:body});
    if (!r.ok) { var d = await r.json().catch(function(){return {};}); throw new Error(d.detail||'发送失败'); }
    var resp = await r.json();
    if (resp.truncated) showError('消息过长，已截断至 '+text.length+' 字符');
    // Optimistic UI: add message immediately, SSE will skip it as duplicate
    addMsg(resp); lastId = resp.id; scrollBottom();
    input.value = ''; input.style.height = 'auto';
  } catch(e) { showError(e.message); }
  finally { sending = false; btn.disabled = false; input.disabled = false; input.focus(); }
}

document.getElementById('msgInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 140) + 'px';
});

init();
</script>
